[benchmark]
kind = "precrack"
half_width = 1.0
history = 0.0

[material]
fracture_toughness = 2.4
length_scale = 0.2

[quadrature]
training_order = 16
evaluation_order = 32

[network]
hidden_width = 16
seed = 1729
zero_initialization = false
dtype = "float64"

[optimizer]
adam_steps = 1000
adam_learning_rate = 0.01
lbfgs_max_iter = 200
lbfgs_tolerance_grad = 1e-10
lbfgs_tolerance_change = 1e-12
line_search = "strong_wolfe"

[acceptance]
phase_relative_l2 = 5e-3
phase_max_abs = 5e-3
energy_relative_error = 1e-4
residual_relative_rms = 5e-2
boundary_flux_max_scaled = 1e-2
hard_boundary_max_abs = 1e-14
bounds_violation = 1e-3